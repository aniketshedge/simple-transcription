[project]
name = "simple-transcription"
version = "0.1.0"
description = "Private, CPU-only WhisperX transcription for your home server"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115.12,<1",
  "uvicorn>=0.34.0,<1",
  "whisperx==3.8.6",
  "transformers>=4.48,<5",
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "torchvision==0.23.0",
  "torchcodec==0.7.0",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

